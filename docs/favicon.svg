<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90c695;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7fb069;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="100" height="100" fill="url(#skyGradient)"/>

  <!-- Back mountain (darkest) -->
  <path d="M 0 60 L 30 25 L 50 40 L 70 20 L 100 50 L 100 100 L 0 100 Z"
        fill="#2d5016"/>

  <!-- Middle mountain -->
  <path d="M 0 70 L 25 45 L 50 55 L 75 35 L 100 65 L 100 100 L 0 100 Z"
        fill="#4a7c2c"/>

  <!-- Meadow/grass area -->
  <path d="M 0 80 L 15 75 L 30 78 L 45 73 L 60 77 L 75 74 L 90 79 L 100 76 L 100 100 L 0 100 Z"
        fill="#7fb069"/>
</svg>
